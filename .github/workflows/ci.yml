name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_PHOTOS: ${{ secrets.R2_BUCKET_PHOTOS }}
      R2_BUCKET_PRIVATE: ${{ secrets.R2_BUCKET_PRIVATE }}
      R2_PUBLIC_URL_PHOTOS: ${{ secrets.R2_PUBLIC_URL_PHOTOS }}
      MAINTENANCE_MODE: 'false'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérification des types (tsc)
        run: npx tsc --noEmit

      - name: Lint (informatif, ne bloque pas le pipeline pour l'instant)
        run: npm run lint
        continue-on-error: true

      - name: Build complet (identique à ce que fait Vercel)
        run: npm run build
